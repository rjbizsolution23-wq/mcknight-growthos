<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="McKnight GrowthOS">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="48%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a72c"/>
      <stop offset="100%" stop-color="#f4ce65"/>
    </linearGradient>
  </defs>
  <!-- rounded tile -->
  <rect x="2" y="2" width="116" height="116" rx="26" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="116" height="116" rx="26" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
  <!-- M built from an upward conversion path: node → up → valley → up to gold endpoint -->
  <path d="M 24 88 L 24 46 L 60 74 L 96 40"
        fill="none" stroke="#f8fafc" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pipeline nodes -->
  <circle cx="24" cy="88" r="8" fill="#0ea5e9" stroke="#f8fafc" stroke-width="3"/>
  <circle cx="60" cy="74" r="7" fill="#2563eb" stroke="#f8fafc" stroke-width="3"/>
  <!-- gold endpoint: completed conversion / revenue -->
  <circle cx="96" cy="40" r="10" fill="url(#goldGrad)" stroke="#f8fafc" stroke-width="3"/>
</svg>
